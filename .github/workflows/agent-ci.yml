name: Agent CI

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main, staging]

permissions:
  contents: read

jobs:
  build:
    name: typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build   # same command Railway runs; catches build-time breaks
      # Inside this job on purpose: 'typecheck + build' is the branch-protection
      # required check, so tests are enforced rather than merely available.
      - run: npm test
